<!doctype html><html><head><title>Notice: Millbrook intake, 3 March 2024</title></head><body><h1>Notice: Millbrook intake, 3 March 2024</h1><p class='by'>Regional Water Authority</p><p>The Authority recorded elevated solvent readings at the Millbrook intake on 3 March 2024 and issued a boil notice affecting 12,000 households.</p><p>The notice was lifted on 6 March 2024.</p></body></html>
